name: app_alfardos
description: "Alfardos Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_app_check: ^0.4.8
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  fl_chart: ^1.2.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  csv: ^8.0.0
  material_symbols_icons: ^4.2960.0
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/branding/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700


flutter_launcher_icons:
  image_path: "assets/branding/icon.png"
  android: "launcher_icon"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  ios: false
  windows:
    generate: true
    image_path: "assets/branding/icon.png"
    icon_size: 256
